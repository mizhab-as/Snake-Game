name: Build and Release SnakeGame

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build macOS app
        run: pyinstaller SnakeGame.spec
      
      - name: Create DMG installer
        run: |
          hdiutil create -volname "SnakeGame" -srcfolder dist/SnakeGame.app -ov -format UDZO dist/SnakeGame.dmg
      
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v3
        with:
          name: macos-builds
          path: |
            dist/SnakeGame.app
            dist/SnakeGame.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Windows executable
        run: pyinstaller SnakeGame-Windows.spec
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-builds
          path: dist/SnakeGame.exe

  create-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v3
      
      - name: Download macOS artifacts
        uses: actions/download-artifact@v3
        with:
          name: macos-builds
          path: ./macos-builds
      
      - name: Download Windows artifacts
        uses: actions/download-artifact@v3
        with:
          name: windows-builds
          path: ./windows-builds
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./macos-builds/SnakeGame.dmg
            ./windows-builds/SnakeGame.exe
          draft: false
          prerelease: false
